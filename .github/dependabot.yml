version: 2
updates:
  # A pnpm-lock.yaml change also needs the pnpm dependencies hash in nix/package.nix, or the Nix checks fail.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pal runs on Node 24, so its types stay on that major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
